name: Liya
options:
  bundleIdPrefix: com.liyalumora
  deploymentTarget:
    iOS: "16.0"
targets:
  Liya:
    type: application
    platform: iOS
    sources:
      - path: Liya/Sources
      - path: Liya/Assets.xcassets
      - path: Liya/LaunchScreen.storyboard
        buildPhase: resources
      - path: Liya/Resources/Examples
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liyalumora.auroramuse
        PRODUCT_NAME: Liya
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Liya/Liya.entitlements
        INFOPLIST_FILE: Liya/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Liya
        INFOPLIST_KEY_NSCameraUsageDescription: Liya uses the camera when you choose to take a photo.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Liya uses the photos and videos you choose for your profile and moments.
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
