name: Liya
options:
  bundleIdPrefix: com.liyalumora
  xcodeVersion: "27.1"
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.5
targets:
  Liya:
    type: application
    platform: iOS
    dependencies:
      - package: Supabase
        product: Supabase
    sources:
      - path: Liya/Sources
      - path: Liya/Assets.xcassets
      - path: Liya/InfoPlist.xcstrings
        buildPhase: resources
      - path: Liya/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Liya/LaunchScreen.storyboard
        buildPhase: resources
    settings:
      configs:
        Release:
          DEAD_CODE_STRIPPING: YES
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liyalumora.auroramuse
        PRODUCT_NAME: Liya
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Liya/Liya.entitlements
        INFOPLIST_FILE: Liya/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Liya
        INFOPLIST_KEY_NSCameraUsageDescription: You can take photos for your profile, posts, and messages or check your framing while waiting for a video call.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: The sound meter lets you check your microphone while you wait for a voice or video call.
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
schemes:
  Liya:
    build:
      targets:
        Liya: all
    archive:
      config: Release
